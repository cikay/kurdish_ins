stages:
  - classify
  - instruction-gen

classify:
  description: Label each Kurmanji entry's web register, write manifest.jsonl
  # The datasets read, one after the other, into one manifest. `files` is the glob of the
  # kmr_Latn parquet files inside the dataset repository; `columns` maps id, url and text
  # to the dataset's own column names. Each manifest row's `source` is its dataset.
  sources:
    - dataset: HuggingFaceFW/fineweb-2
      files: data/kmr_Latn/train/*.parquet
      columns: {id: id, url: url, text: text}
    - dataset: muzaffercky/kurdish-theses-yok
      files: kmr_Latn/train-*.parquet
      columns: {id: tez_id, url: url, text: text}
  # A JSONL file of entries to classify instead of the sources, e.g. the output of
  # `python -m scripts.sample_fineweb`. Each line needs `id`, `url` and `text`.
  # Comment it out (or set it to `null`) to classify every entry of every source.
  # input_file: s5.jsonl
  # TurkuNLP/web-register-classification-multilingual is multi-label: a register is
  # predicted when its sigmoid score is above this. Every score is written to the
  # manifest too, so a later stage can re-threshold without classifying again.
  threshold: 0.5
  # Entries classified at a time, and windows (see max_length) per model call. The windows
  # of all the entries go through the model together, so a batch is full even when most
  # entries fit in one window. Raise it on a GPU.
  batch_size: 8
  # Tokens per window. The classifier reads one window at a time, so a longer entry is cut
  # into windows and each label's score is averaged over them. 512 is XLM-R's limit: it
  # has position embeddings for 512 tokens and no more.
  max_length: 512
  # Tokens neighbouring windows share, so a sentence cut at a window's end is read whole
  # in the next one too. 0 means windows do not overlap and every token counts once.
  stride: 0
  # The precision the model runs in: float32, or bfloat16 (16-bit numbers with 2–3
  # significant digits). bfloat16 is several times faster on a GPU but rounds every step,
  # so scores move in the 2nd–3rd decimal and a score near the threshold can cross it.
  dtype: float32

instruction-gen:
  description: Ask Gemini for one question per chosen entry, answered by its own text
  # The classify manifest to read instead of data/classify/<run>/manifest.jsonl, e.g. one
  # downloaded from Modal. Comment it out (or set it to `null`) to read this run's own.
  input_manifest: data/modal/full/manifest.jsonl
  # An entry is used when any label of allow_any scores above its threshold and no label of
  # forbid_any does. The scores are classify's, so changing a threshold needs no new
  # classify run. Allowed: informational, encyclopedia, biographies, FAQs, how-tos, recipes.
  # Forbidden: machine-translated, news (and sports, blogs), opinion, promotion and ads, so
  # the pairs are about facts that do not go out of date.
  allow_any: {IN: 0.5, en: 0.5, dtp: 0.5, fi: 0.5, HI: 0.5, re: 0.5}
  # MT is stricter than the others: spam sites auto-translated into Kurmanji often score
  # below 0.5 on MT and still get IN. 0.2 is a first guess; check what it drops.
  forbid_any: {MT: 0.2, NA: 0.5, ne: 0.5, sr: 0.5, nb: 0.5, OP: 0.5, IP: 0.5, ds: 0.5}
  # Sources whose every entry is used, whatever its scores. Many theses get no
  # label because their windows' scores average out, but all of them are academic text.
  keep_sources:
    - muzaffercky/kurdish-theses-yok
  # Domains whose entries skip the MT check of forbid_any; every other rule still applies.
  # Many Kurdish Wikipedia articles score MT 0.2-0.3, like the spam sites MT is meant to
  # drop. Keeping whole domains instead would let in kurdipedia's news and Wikipedia's talk
  # pages, which allow_any and the other forbid_any labels drop.
  mt_exempt_domains:
    - ku.wikipedia.org
    - ku.m.wikipedia.org
    - www.kurdipedia.org
    - ku.wiktionary.org
  # A longer entry is cut at line breaks into chunks of at most this many words, and each
  # chunk gets its own question. The theses are about 45,000 words each.
  chunk_words: 1500
  # Chunks with fewer words are not sent to the model.
  min_words: 50
  model: gemini-3.8-flash
  temperature: 0.3
  # A pair whose answer has fewer words is dropped.
  min_answer_words: 15
  # Chunks sent to Gemini at the same time. Lower it if most calls are rate limited.
  workers: 8
  # Tries per chunk on a rate limit or server error before leaving it for the next run.
  retries: 3
  # Chunks sent, picked at random with `seed`: the same seed picks the same chunks for each
  # prompt, so two sample runs can be compared. The files go to data/instruction-gen/
  # limit-<limit>/, e.g. data/instruction-gen/limit-200/. Set it to null for every chunk.
  limit: 20
  seed: 0

# Where each stage runs on Modal (modal_app/app.py). pipeline.py does not read this.
modal:
  classify:
    # In float32 an A100 read about 48 windows/s (measured), so all the sources (about
    # 1,000,000 windows: 935,000 from FineWeb2, 65,000 from the 408 theses) take about
    # 5.5 hours. bfloat16 uses its 16-bit matrix units and should be several times faster.
    gpu: A100
    # Modal ends the call after this long. Its limit is 24 hours.
    timeout_minutes: 720
    # Windows per model call on the GPU, in place of classify.batch_size, which is sized for
    # the Mac and leaves a big GPU mostly idle. It does not change what is written: the
    # padding in a batch is masked out, so a window scores the same in any batch, up to
    # float rounding in the last digits.
    batch_size: 64
    # In place of classify.dtype. The A100 is fastest in bfloat16.
    dtype: bfloat16
